name: Run the notebooks

# Runs the notebooks the way a student runs them, in the environment the
# installation instructions produce, so that breakage in upstream packages
# shows up here rather than in the lecture hall.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"   # every Monday morning, before the lecture

jobs:
  conda:
    name: conda / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # GitHub's Azure runners expose an RDMA device (mana_0) that MPICH's UCX
      # layer tries to open and fails on, aborting MPI_Init. Confine UCX to
      # loopback. This is a property of the runner, not of the installation.
      UCX_TLS: tcp,self,sm
      UCX_NET_DEVICES: lo
    defaults:
      run:
        shell: bash -el {0}   # -l so that conda activation is picked up
    steps:
      - uses: actions/checkout@v7

      - name: Install OpenGL and off-screen rendering support (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libosmesa6 is what lets VTK render with no display at all. Without
          # it VTK falls through X, then EGL, then segfaults.
          sudo apt-get install -y libgl1 libglx-mesa0 libosmesa6 libxrender1 libxcursor1 xvfb

      - name: Fetch the environment file from the installation instructions
        # The environment is not defined here: it is the one students install
        # by following https://github.com/cmaurini/fenicsx-install, and this
        # job must fail if the notebooks stop working in it.
        run: |
          curl -sSfL -o environment.yml \
            https://raw.githubusercontent.com/cmaurini/fenicsx-install/main/environment.yml
          cat environment.yml

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: fenicsx-0.11
          channel-priority: strict
          conda-remove-defaults: "true"   # keep conda-forge the only channel

      - name: Report versions
        run: |
          conda list "fenics-dolfinx|gmsh|pyvista|scifem|jupyterlab"
          python -c "import dolfinx; assert dolfinx.__version__.startswith('0.11'), dolfinx.__version__"
          python -c "import scifem; print('scifem', scifem.__version__)"

      - name: Register the kernel the notebooks ask for
        run: |
          python -m ipykernel install --user --name fenicsx-0.11 --display-name "FEniCSx 0.11"
          jupyter kernelspec list

      - name: Check the environment carries what it promises
        run: python tools/check_environment.py environment.yml

      - name: Run the notebooks
        # Not PYVISTA_OFF_SCREEN: the notebooks skip plotting when it is set,
        # and the point of this job is to check that the figures come out.
        run: |
          RUN=""
          [ "${{ runner.os }}" = "Linux" ] && RUN="xvfb-run -a"
          $RUN jupyter nbconvert --to notebook --execute \
            --output-dir executed linear-elasticity/*.ipynb

      - name: Check what the run produced
        run: python tools/check_notebooks.py executed/*.ipynb

      - name: Check the result files were written
        run: |
          test -s linear-elasticity/output/mesh.xdmf
          test -s linear-elasticity/output/elasticity-demo.xdmf
          test -s linear-elasticity/output/elasticity-demo.h5

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: executed-conda-${{ matrix.os }}
          path: |
            executed/
            linear-elasticity/output/

  image:
    name: image / online environment (Codespaces, Binder)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: env-0.11
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the image students launch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report versions
        run: |
          docker run --rm $IMAGE:$TAG python -c "import dolfinx; assert dolfinx.__version__.startswith('0.11'), dolfinx.__version__; print('dolfinx', dolfinx.__version__)"
          docker run --rm $IMAGE:$TAG python -c "import scifem; print('scifem', scifem.__version__)"
          docker run --rm $IMAGE:$TAG jupyter kernelspec list

      - name: Check the environment carries what it promises
        # Against the environment file baked into the image, so that a package
        # added to the installation instructions and missing here fails now.
        run: |
          docker run --rm -v "$PWD:/work" -w /work $IMAGE:$TAG \
            python tools/check_environment.py

      - name: Run the notebooks in it
        run: |
          docker run --rm -v "$PWD:/work" -w /work $IMAGE:$TAG \
            bash -c "jupyter nbconvert --to notebook --execute \
                       --output-dir executed linear-elasticity/*.ipynb"

      - name: Check what the run produced
        run: |
          docker run --rm -v "$PWD:/work" -w /work $IMAGE:$TAG \
            python tools/check_notebooks.py executed/*.ipynb

      - name: Publish the image
        # Only from main, and only below this line: what Binder and Codespaces
        # pull is an image the notebooks have just run in. It is pushed before
        # the Binder image is built on top of it, because `.binder/Dockerfile`
        # starts FROM this published tag: gated behind that build, the first
        # run could never publish the image that build needs.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag $IMAGE:$TAG $IMAGE:sha-${GITHUB_SHA::7}
          docker push $IMAGE:$TAG
          docker push $IMAGE:sha-${GITHUB_SHA::7}

      # The Binder image is this one plus a user and the repository, so it is
      # built here too: the badge in the README is then a link that has been
      # launched, not a hope.
      - name: Build the Binder image on top of it
        # On the default builder, the one backed by the docker daemon: the base
        # image is then the one built above, taken from the local store instead
        # of pulled from ghcr.io, and the image repo2docker produces is left
        # where the next step can run it. repo2docker passes neither --load nor
        # --push, so on the container driver of setup-buildx-action the result
        # would stay in the build cache and the run below would find nothing.
        #
        # --user-id 1000 is the uid mybinder.org builds with. Left to itself
        # repo2docker builds with the uid of whoever runs it, 1001 on this
        # runner, and a uid already taken in the base image passes here and
        # fails on mybinder.org.
        run: |
          docker buildx use default
          python -m pip install --quiet jupyter-repo2docker
          jupyter-repo2docker --no-run --user-id 1000 --user-name jovyan \
            --image-name m2fr-binder .

      - name: Run the notebooks in the Binder image, under Binder's memory cap
        # 2 GB is what mybinder.org gives a session. A notebook that needs more
        # must fail here rather than in front of the class.
        run: |
          docker run --rm --memory=2g m2fr-binder \
            bash -c "jupyter nbconvert --to notebook --execute \
                       --output-dir executed linear-elasticity/*.ipynb \
                     && python tools/check_notebooks.py executed/*.ipynb"


      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: executed-image
          path: executed/
